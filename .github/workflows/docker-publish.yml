name: Build and Push Container Images

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*.*.*"
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version override (e.g., 0.1.0 or 0.0.5-preview). Leave empty to auto-resolve from VERSION / branch."
        required: false
        type: string
      include_dev:
        description: "Also build and push dev-<version> image (Dockerfile.dev)"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: information_harvester

jobs:
  test-and-lint:
    name: Run Quality Gates (Go, Web, Helm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum

      - name: Run Go Backend Tests
        working-directory: backend
        run: go test -v ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build Next.js Web Dashboard
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: helm lint charts/information-harvester

  build-and-push:
    name: Build & Push Images to GHCR
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      backend_tag: ${{ steps.meta.outputs.backend_tag }}
      web_tag: ${{ steps.meta.outputs.web_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Semantic Version & Image Tags
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_IMAGE="${REGISTRY}/${OWNER}/${IMAGE_NAME}"

          # 1. Determine base version
          if [ -n "${{ inputs.version }}" ]; then
            RAW_VER="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/}"
          elif [ -f VERSION ]; then
            RAW_VER=$(tr -d '[:space:]' < VERSION)
          else
            RAW_VER="0.1.0"
          fi

          # Strip leading 'v' if present (e.g., v0.1.0 -> 0.1.0)
          VER="${RAW_VER#v}"

          # 2. Append -preview when building from develop branch (unless already suffixed)
          if [ "${{ github.ref_name }}" = "develop" ] && [ -z "${{ inputs.version }}" ]; then
            if [[ "${VER}" != *-preview ]]; then
              VER="${VER}-preview"
            fi
          fi

          BACKEND_TAG="${REPO_IMAGE}:backend-${VER}"
          WEB_TAG="${REPO_IMAGE}:web-${VER}"
          DEV_TAG="${REPO_IMAGE}:dev-${VER}"

          echo "Resolved Version : ${VER}"
          echo "Backend Image    : ${BACKEND_TAG}"
          echo "Web Image        : ${WEB_TAG}"

          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "backend_tag=${BACKEND_TAG}" >> "$GITHUB_OUTPUT"
          echo "web_tag=${WEB_TAG}" >> "$GITHUB_OUTPUT"
          echo "dev_tag=${DEV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image (backend-${{ steps.meta.outputs.version }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push Web image (web-${{ steps.meta.outputs.version }})
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.web_tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push Dev CLI image (dev-${{ steps.meta.outputs.version }})
        if: ${{ inputs.include_dev == true }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          push: true
          tags: ${{ steps.meta.outputs.dev_tag }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

