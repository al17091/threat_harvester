name: Build and Push Container Images

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version override (e.g., 0.1.0 or 0.0.5-preview). Leave empty to auto-resolve from VERSION / branch."
        required: false
        type: string
      include_dev:
        description: "Also build and push dev-<version> image (Dockerfile.dev)"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: threat_harvester

jobs:
  test-and-lint:
    name: Run Quality Gates (Go API, Worker Python, Web, Helm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Run Go API Tests
        working-directory: api
        run: go test -v ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: worker/requirements-dev.txt

      - name: Run Worker Python Tests
        working-directory: worker
        env:
          DATABASE_URL: ""
          GEMINI_API_KEY: ""
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pytest tests/

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Test & Build Next.js Web Dashboard
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm Chart
        run: helm lint charts/threat-harvester

  build-and-push:
    name: Build & Push Images to GHCR
    needs: test-and-lint
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      api_tag: ${{ steps.meta.outputs.api_tag }}
      worker_tag: ${{ steps.meta.outputs.worker_tag }}
      web_tag: ${{ steps.meta.outputs.web_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve Semantic Version & Image Tags
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_IMAGE="${REGISTRY}/${OWNER}/${IMAGE_NAME}"

          # 1. Determine base version
          if [ -n "${{ inputs.version }}" ]; then
            RAW_VER="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/}"
          elif [ -f VERSION ]; then
            RAW_VER=$(tr -d '[:space:]' < VERSION)
          else
            RAW_VER="0.1.0"
          fi

          # Strip leading 'v' if present (e.g., v0.1.0 -> 0.1.0)
          VER="${RAW_VER#v}"

          # 2. Append -preview when building from develop branch (unless already suffixed)
          if [ "${{ github.ref_name }}" = "develop" ] && [ -z "${{ inputs.version }}" ]; then
            if [[ "${VER}" != *-preview ]]; then
              VER="${VER}-preview"
            fi
          fi

          API_TAG="${REPO_IMAGE}:api-${VER}"
          BACKEND_TAG="${REPO_IMAGE}:backend-${VER}"
          WORKER_TAG="${REPO_IMAGE}:worker-${VER}"
          WEB_TAG="${REPO_IMAGE}:web-${VER}"
          DEV_TAG="${REPO_IMAGE}:dev-${VER}"

          echo "Resolved Version : ${VER}"
          echo "API Image        : ${API_TAG}"
          echo "Worker Image     : ${WORKER_TAG}"
          echo "Web Image        : ${WEB_TAG}"

          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "api_tag=${API_TAG}" >> "$GITHUB_OUTPUT"
          echo "backend_tag=${BACKEND_TAG}" >> "$GITHUB_OUTPUT"
          echo "worker_tag=${WORKER_TAG}" >> "$GITHUB_OUTPUT"
          echo "web_tag=${WEB_TAG}" >> "$GITHUB_OUTPUT"
          echo "dev_tag=${DEV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Go API image (api-${{ steps.meta.outputs.version }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.api_tag }},${{ steps.meta.outputs.backend_tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Python Worker image (worker-${{ steps.meta.outputs.version }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.worker_tag }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build and push Web image (web-${{ steps.meta.outputs.version }})
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.web_tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push Dev CLI image (dev-${{ steps.meta.outputs.version }})
        if: ${{ inputs.include_dev == true }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dev
          push: true
          tags: ${{ steps.meta.outputs.dev_tag }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
