name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Run Quality Gates (Go API, Worker Python, Web, Helm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Run Go API Tests
        working-directory: api
        run: go test -v ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: worker/requirements-dev.txt

      - name: Run Worker Python Tests
        working-directory: worker
        env:
          DATABASE_URL: ""
          GEMINI_API_KEY: ""
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pytest tests/

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Test & Build Next.js Web Dashboard
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm Chart
        run: helm lint charts/threat-harvester

