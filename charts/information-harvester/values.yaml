# Default values for information-harvester.

# Production image for Web Dashboard and Batch runner
image:
  repository: ghcr.io/dapt/information_harvester
  tag: latest
  pullPolicy: IfNotPresent

# Development image for Dev / Ops container
devImage:
  repository: ghcr.io/dapt/information_harvester
  tag: dev
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Web Dashboard Service & Deployment
dashboard:
  enabled: true
  replicas: 1
  port: 8080
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: cti.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Database Configuration (PostgreSQL / CloudNativePG or SQLite fallback)
database:
  type: "postgres"  # "postgres" (recommended for k3s CNPG) or "sqlite"
  # Existing secret name from CNPG cluster (e.g. "information-harvester-db-app")
  # When set, DATABASE_URL will be mounted from the Secret's "uri" key
  existingSecret: ""
  host: "information-harvester-db-rw"
  port: 5432
  name: "information_harvester"
  user: "harvester"
  password: ""
  sslmode: "prefer"
  # CloudNativePG (CNPG) Cluster specification
  cnpg:
    enabled: false  # Set to true to create a CloudNativePG Cluster CRD manifest
    instances: 1
    storage:
      size: 5Gi
      storageClass: ""

# Secrets configuration
secrets:
  # Existing secret name if managed externally (e.g. sealed-secrets / vault)
  existingSecret: ""
  # Or provide values directly here
  geminiApiKey: ""
  discordWebhookUrl: ""
  slackWebhookUrl: ""
  genericWebhookUrl: ""
  notionApiKey: ""
  notionDatabaseId: ""

# General application configuration
config:
  geminiModel: "gemini-2.5-flash"
  checkIntervalHours: 1
  notifyDirectOnly: false
  requestTimeout: 25

# Scheduled harvester CronJob
cronjob:
  enabled: true
  schedule: "0 * * * *"  # Run hourly
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Development & Command-execution container
devContainer:
  enabled: false
  replicas: 1
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Tor SOCKS5 Proxy Service & Deployment
tor:
  enabled: false  # Disabled by default since Tor SOCKS5 is provided externally
  externalProxyUrl: "socks5h://127.0.0.1:9050"
  image:
    repository: alpine
    tag: "3.20"
    pullPolicy: IfNotPresent
  port: 9050
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Persistent storage for SQLite cache (if database.type is sqlite)
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 5Gi
  storageClass: ""
