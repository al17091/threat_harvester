{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "information-harvester.fullname" . }}-dashboard
  labels:
    {{- include "information-harvester.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      {{- include "information-harvester.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "information-harvester.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository | default .Values.image.repository }}:{{ .Values.dashboard.image.tag | default (printf "web-%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy | default .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.dashboard.port | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: BACKEND_URL
              value: "http://{{ include "information-harvester.fullname" . }}-backend:{{ .Values.backend.service.port }}"
          envFrom:
            - secretRef:
                name: {{ include "information-harvester.secretName" . }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
{{- end }}
