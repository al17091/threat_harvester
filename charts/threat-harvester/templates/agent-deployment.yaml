{{- if and .Values.agent .Values.agent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "threat-harvester.fullname" . }}-agent
  labels:
    {{- include "threat-harvester.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: {{ .Values.agent.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "threat-harvester.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "threat-harvester.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository | default .Values.image.repository }}:{{ .Values.agent.image.tag | default (printf "agent-%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy | default .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.agent.port | default 8002 }}
              name: http
          env:
            - name: AGENT_PORT
              value: "{{ .Values.agent.port | default 8002 }}"
            - name: LITELLM_ENDPOINT
              value: "{{ .Values.config.litellmEndpoint | default "http://litellm-service.litellm.svc.cluster.local:4000/v1/chat/completions" }}"
            - name: LITELLM_MODEL
              value: "{{ .Values.config.litellmModel | default "qwen2.5-3b-instruct" }}"
            - name: PLAMO_BASE_URL
              value: "{{ .Values.agent.plamoBaseUrl | default "http://plamo-translator-service.litellm.svc.cluster.local:8080" }}"
            - name: OLLAMA_BASE_URL
              value: "http://ollama-service.litellm.svc.cluster.local:11434"
            - name: PLAMO_MODEL
              value: "plamo-3-translate:2b"
            - name: SEARXNG_URL
              value: "{{ .Values.config.searxngUrl | default "https://searxng.lab.internal/search" }}"
          {{- if .Values.agent.resources }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.agent.port | default 8002 }}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.agent.port | default 8002 }}
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "threat-harvester.fullname" . }}-agent
  labels:
    {{- include "threat-harvester.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.agent.port | default 8002 }}
      targetPort: {{ .Values.agent.port | default 8002 }}
      protocol: TCP
      name: http
  selector:
    {{- include "threat-harvester.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent
{{- end }}
