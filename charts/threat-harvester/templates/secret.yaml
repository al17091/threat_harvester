{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "threat-harvester.secretName" . }}
  labels:
    {{- include "threat-harvester.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | default "harvester2026" | quote }}
  AI_API_KEY: {{ .Values.secrets.aiApiKey | default "" | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  DISCORD_WEBHOOK_URL: {{ .Values.secrets.discordWebhookUrl | quote }}
  SLACK_WEBHOOK_URL: {{ .Values.secrets.slackWebhookUrl | quote }}
  GENERIC_WEBHOOK_URL: {{ .Values.secrets.genericWebhookUrl | quote }}
  NOTION_API_KEY: {{ .Values.secrets.notionApiKey | quote }}
  NOTION_DATABASE_ID: {{ .Values.secrets.notionDatabaseId | quote }}
  DB_PASSWORD: {{ .Values.database.password | quote }}
{{- end }}
