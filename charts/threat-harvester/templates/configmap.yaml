apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "threat-harvester.fullname" . }}-config
  labels:
    {{- include "threat-harvester.labels" . | nindent 4 }}
data:
  PORT: {{ ((.Values.api | default dict).port) | default ((.Values.backend | default dict).port) | default 8000 | quote }}
  COMPLIANCE_MODE: {{ .Values.config.complianceMode | default "all" | quote }}
  AI_PRIMARY_PROVIDER: {{ .Values.config.aiPrimaryProvider | default "openai_compatible" | quote }}
  LITELLM_ENDPOINT: {{ .Values.config.litellmEndpoint | default "https://litellm.lab.internal/v1/chat/completions" | quote }}
  LITELLM_MODEL: {{ .Values.config.litellmModel | default "qwen2.5-3b-instruct" | quote }}
  GEMINI_MODEL: {{ .Values.config.geminiModel | default "gemini-3.5-flash-lite" | quote }}
  SEARXNG_URL: {{ .Values.config.searxngUrl | default "https://searxng.lab.internal/search" | quote }}
  CHECK_INTERVAL_HOURS: {{ .Values.config.checkIntervalHours | quote }}
  ENABLE_SCHEDULER: {{ if eq (.Values.config.enableScheduler | toString) "false" }}"false"{{ else }}"true"{{ end }}
  NOTIFY_DIRECT_ONLY: {{ .Values.config.notifyDirectOnly | quote }}
  NOTIFY_LANGUAGE: {{ .Values.config.notifyLanguage | default "en" | quote }}
  CIRCUIT_BREAKER_MAX_ALERTS: {{ .Values.config.circuitBreakerMaxAlerts | default 5 | quote }}
  NOTIFY_DRY_RUN: {{ if eq (.Values.config.notifyDryRun | toString) "true" }}"true"{{ else }}"false"{{ end }}
  {{- if and .Values.browserless .Values.browserless.enabled }}
  BROWSERLESS_URL: "http://{{ include "threat-harvester.fullname" . }}-browserless:{{ .Values.browserless.port | default 3000 }}"
  {{- else if .Values.config.browserlessUrl }}
  BROWSERLESS_URL: {{ .Values.config.browserlessUrl | quote }}
  {{- end }}
  REQUEST_TIMEOUT: {{ .Values.config.requestTimeout | quote }}
  DB_TYPE: {{ .Values.database.type | quote }}
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  DB_SSLMODE: {{ .Values.database.sslmode | quote }}
  {{- if .Values.tor.enabled }}
  TOR_PROXY_URL: "socks5h://{{ include "threat-harvester.fullname" . }}-tor:{{ .Values.tor.port }}"
  {{- else if .Values.tor.externalProxyUrl }}
  TOR_PROXY_URL: {{ .Values.tor.externalProxyUrl | quote }}
  {{- else }}
  TOR_PROXY_URL: "socks5h://127.0.0.1:9050"
  {{- end }}
  CACHE_DB_PATH: "/app/data/threat_cache.db"
