# Default values for threat-harvester.

# Base repository & version (shared across api, worker, web, and cronjob)
image:
  repository: ghcr.io/al17091/threat_harvester
  version: "0.1.0"
  tag: "api-0.1.0"
  pullPolicy: IfNotPresent

# Development image for Dev / Ops container
devImage:
  repository: ghcr.io/al17091/threat_harvester
  tag: "dev-0.1.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Go CTI Engine & REST API Service & Deployment
api:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/al17091/threat_harvester
    tag: "api-0.1.0"
    pullPolicy: IfNotPresent
  port: 8000
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Python Threat Harvester & Batch Worker Deployment
worker:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/al17091/threat_harvester
    tag: "worker-0.1.0"
    pullPolicy: IfNotPresent
  mode: "batch"  # "batch" or "api"
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Next.js Cyber SOC Web Dashboard Service & Deployment
dashboard:
  enabled: true
  replicas: 1
  basePath: "/thhv"
  image:
    repository: ghcr.io/al17091/threat_harvester
    tag: "web-0.1.0"
    pullPolicy: IfNotPresent
  port: 3000
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: cti.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Database Configuration (PostgreSQL / CloudNativePG or SQLite fallback)
database:
  type: "postgres"  # "postgres" (recommended for k3s CNPG) or "sqlite"
  # Existing secret name from CNPG cluster (e.g. "threat-harvester-db-app")
  # When set, DATABASE_URL will be mounted from the Secret's "uri" key
  existingSecret: ""
  host: "threat-harvester-db-rw"
  port: 5432
  name: "threat_harvester"
  user: "harvester"
  password: ""
  sslmode: "prefer"
  # CloudNativePG (CNPG) Cluster specification
  cnpg:
    enabled: false  # Set to true to create a CloudNativePG Cluster CRD manifest
    instances: 1
    storage:
      size: 5Gi
      storageClass: ""

# Secrets configuration
secrets:
  # Existing secret name if managed externally (e.g. sealed-secrets / vault)
  existingSecret: ""
  # Or provide values directly here
  adminPassword: "harvester2026"
  aiApiKey: ""
  geminiApiKey: ""
  discordWebhookUrl: ""
  slackWebhookUrl: ""
  genericWebhookUrl: ""
  notionApiKey: ""
  notionDatabaseId: ""

# General application configuration
config:
  complianceMode: "all"
  aiPrimaryProvider: "openai_compatible"
  litellmEndpoint: "https://litellm.lab.internal/v1/chat/completions"
  litellmModel: "qwen2.5-3b-instruct"
  geminiModel: "gemini-3.5-flash-lite"
  searxngUrl: "https://searxng.lab.internal/search"
  checkIntervalHours: 1
  enableScheduler: true
  notifyDirectOnly: false
  requestTimeout: 25

# Standalone scheduled harvester CronJob
cronjob:
  enabled: false
  schedule: "0 * * * *"  # Run hourly
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  image:
    repository: ghcr.io/al17091/threat_harvester
    tag: "worker-0.1.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Development & Command-execution container
devContainer:
  enabled: false
  replicas: 1
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Tor SOCKS5 Proxy Service & Deployment
tor:
  enabled: false  # Disabled by default since Tor SOCKS5 is provided externally
  externalProxyUrl: "socks5h://127.0.0.1:9050"
  image:
    repository: alpine
    tag: "3.20"
    pullPolicy: IfNotPresent
  port: 9050
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Persistent storage for SQLite cache (if database.type is sqlite)
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 5Gi
  storageClass: ""
