[project]
name = "information-harvester"
version = "0.2.0"
description = "Cyber Threat Intelligence Harvester focusing on Japan-targeted threats"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
