services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: harvester-web
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://api:8000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-harvester2026}
      - BASE_PATH=${BASE_PATH:-/thhv}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: harvester-api
    expose:
      - "8000"
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/threat_harvester
      - TOR_PROXY_URL=${TOR_PROXY_URL:-socks5h://host.docker.internal:9050}
      - AI_PRIMARY_PROVIDER=${AI_PRIMARY_PROVIDER:-openai_compatible}
      - LITELLM_ENDPOINT=${LITELLM_ENDPOINT:-https://litellm.lab.internal/v1/chat/completions}
      - LITELLM_MODEL=${LITELLM_MODEL:-qwen2.5-3b-instruct}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - GENERIC_WEBHOOK_URL=${GENERIC_WEBHOOK_URL:-}
      - NOTION_API_KEY=${NOTION_API_KEY:-}
      - NOTION_DATABASE_ID=${NOTION_DATABASE_ID:-}
    volumes:
      - ./config.yaml:/app/config.yaml
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: harvester-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MODE=${WORKER_MODE:-batch}
      - CHECK_INTERVAL_HOURS=${CHECK_INTERVAL_HOURS:-1}
      - NOTIFY_DIRECT_ONLY=${NOTIFY_DIRECT_ONLY:-false}
      - BACKEND_URL=http://api:8000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/threat_harvester
      - TOR_PROXY_URL=${TOR_PROXY_URL:-socks5h://host.docker.internal:9050}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - GENERIC_WEBHOOK_URL=${GENERIC_WEBHOOK_URL:-}
      - NOTION_API_KEY=${NOTION_API_KEY:-}
      - NOTION_DATABASE_ID=${NOTION_DATABASE_ID:-}
    volumes:
      - ./config.yaml:/app/config.yaml
      - backend_data:/app/data
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: harvester-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=threat_harvester
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d threat_harvester"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  backend_data:
